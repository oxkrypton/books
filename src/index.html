<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="一个简单的线上书架。点击书名，打开 PDF。">
    <title>书架 · Books</title>
    <link rel="canonical" href="https://books.ronyu.me/">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23262220'/%3E%3Cpath d='M16 16h13c4 0 6 2 6 5v29c0-4-3-6-7-6H16zm32 0H35v34c0-4 3-6 7-6h6z' fill='%23f8f6f2'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <span class="wordmark">BOOKS</span>
        <span class="domain">books.ronyu.me</span>
      </header>
      <main>
        <div class="heading">
          <h1>书架<span class="heading-dot">.</span></h1>
          <span class="count">{{BOOK_COUNT}} 本书</span>
        </div>
        <section class="shelf" aria-label="PDF 书籍">
{{BOOK_ROWS}}
        </section>
      </main>
      <footer>慢慢读。</footer>
    </div>
  </body>
</html>
